<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    
    <!-- Primary Meta Tags -->
    <title>Na Hora Frota · Gestão de frota em tempo real</title>
    <meta name="title" content="Na Hora Frota · Gestão de frota em tempo real" />
    <meta name="description" content="Rastreamento, romaneios, SLA e acerto financeiro em uma tela só. Entrega sempre na hora.">
    <meta name="author" content="Na Hora Frota" />
    <meta name="keywords" content="gestão de frota, rastreamento, entregas, logística, GPS, romaneio, motoristas">
    
    <!-- iOS specific meta tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="NaHoraFrota" />
    <meta name="format-detection" content="telephone=no" />
    
    <!-- PWA Theme -->
    <meta name="theme-color" content="#090A0B" />
    <meta name="msapplication-TileColor" content="#080808" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://nahorafrota.tech/" />
    
    
    <meta property="og:image" content="https://nahorafrota.tech/og-image.png">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://nahorafrota.tech/" />
    
    
    <meta name="twitter:image" content="https://nahorafrota.tech/og-image.png">
    
    <!-- Tema e acessibilidade antes da primeira pintura (ver src/lib/preferences.ts). -->
    <script>
      (function () {
        var root = document.documentElement;
        try {
          var p = JSON.parse(localStorage.getItem("nhf-prefs") || "{}");
          var theme = p.theme || "dark";
          if (theme === "system") theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          root.classList.add(theme);
          if (p.textSize && p.textSize !== "normal") root.dataset.textSize = p.textSize;
          if (p.motion === "reduce") root.dataset.motion = "reduce";
          if (p.contrast === "more") root.dataset.contrast = "more";
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", theme === "dark" ? "#090A0B" : "#F9FAFB");
        } catch (e) {
          root.classList.add("dark");
        }
      })();
    </script>

    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    
    <!-- PWA Manifest -->
    
  
  
  
  <meta property="og:title" content="Na Hora Frota · Gestão de frota em tempo real">

  <meta name="twitter:description" content="Rastreamento, romaneios, SLA e acerto financeiro em uma tela só. Entrega sempre na hora.">
</head>

  </body>
