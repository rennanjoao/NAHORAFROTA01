    <!-- Tema e acessibilidade antes da primeira pintura (ver src/lib/preferences.ts). -->
    <script>
      (function () {
        var root = document.documentElement;
        try {
          var p = JSON.parse(localStorage.getItem("nhf-prefs") || "{}");
          var theme = p.theme || "dark";
          if (theme === "system") theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          root.classList.add(theme);
          if (p.textSize && p.textSize !== "normal") root.dataset.textSize = p.textSize;
          if (p.motion === "reduce") root.dataset.motion = "reduce";
          if (p.contrast === "more") root.dataset.contrast = "more";
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", theme === "dark" ? "#090A0B" : "#F9FAFB");
        } catch (e) {
          root.classList.add("dark");
        }
      })();
    </script>
